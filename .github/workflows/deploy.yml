# CD: деплой на VPS после зелёного CI при пуше в main.
# Путь тот же, что у ручного деплоя: tar-загрузка исходников -> compose build -> up.
# Секреты Actions: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY (создаёт владелец репозитория).
name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    runs-on: ubuntu-latest
    needs: checks
    env:
      SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          # Ключ, вставленный из Windows UI, может содержать CRLF — нормализуем
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            $SSH_TARGET 'echo SSH-AUTH-OK'

      - name: Upload sources
        shell: bash
        run: |
          tar --exclude=./.git \
              --exclude=./.idea \
              --exclude=./node_modules \
              --exclude=./dist \
              --exclude='*.env' \
              --exclude=./DEV_NOTES.md \
              --exclude=./specs \
              -czf /tmp/deploy.tar.gz .
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            $SSH_TARGET 'rm -rf ~/task-board && mkdir -p ~/task-board'
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            /tmp/deploy.tar.gz $SSH_TARGET:~/deploy.tar.gz
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            $SSH_TARGET 'tar -xzf ~/deploy.tar.gz -C ~/task-board && rm ~/deploy.tar.gz'

      - name: Sync secrets, build and run
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes $SSH_TARGET '
            set -e
            cd ~/task-board
            if [ ! -f ~/task-board.secrets.env ]; then
              printf "POSTGRES_PASSWORD=%s\nJWT_SECRET=%s\n" "$(openssl rand -hex 16)" "$(openssl rand -hex 32)" > ~/task-board.secrets.env
            fi
            cp ~/task-board.secrets.env .env
            docker compose build app
            docker compose up -d --remove-orphans
            docker image prune -f
          '

      - name: Health check
        run: |
          sleep 10
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes $SSH_TARGET '
            cd ~/task-board
            SITE=$(grep "^SITE_ADDRESS=" .env | cut -d= -f2- | cut -d, -f1 | tr -d " ")
            curl -fsS --max-time 20 "https://$SITE/api/health"
          '
