# E2E по требованию (NFR-14): полный Playwright-набор на временном сервере.
# Запуск: Actions → e2e → Run workflow. Не запускается на push (экономия минут).
name: e2e

on:
  workflow_dispatch:

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @task-board/e2e exec playwright install --with-deps chromium

      - name: Build client and server
        run: pnpm build

      # Сервер отдаёт собранный client/dist; почта — консольный транспорт (.localmail),
      # БД — встроенный PostgreSQL (USE_EXTERNAL_DB=0), как в офлайн-режиме.
      - name: Start server
        run: |
          USE_EXTERNAL_DB=0 MAIL_MODE=console nohup pnpm --filter @task-board/server start \
            > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/health; then echo; exit 0; fi
            sleep 2
          done
          echo "server did not start"; cat /tmp/server.log; exit 1

      - name: Run Playwright
        env:
          E2E_BASE_URL: http://localhost:3001
        run: pnpm --filter @task-board/e2e exec playwright test

      - name: Server log on failure
        if: failure()
        run: cat /tmp/server.log

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
