# CI: типовые проверки на push в ветки и PR (а также reusable для deploy).
# Пуш в main не триггерит CI напрямую — его проверки запускает deploy.yml,
# чтобы не гонять их дважды.
name: ci

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
